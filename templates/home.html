{% extends "layout.html" %}

{% block content %}
    {% for post in posts %}
        <div>
            <h2>
                <a href="{{ url_for('post', post_id=post.id) }}">
                    {{ post.title }}
                </a>
            </h2>
            <p>By {{ post.author }} on {{ post.date_posted }}</p>
            <p>{{ post.content }}</p>
        </div>
    {% endfor %}
{% endblock content %}
